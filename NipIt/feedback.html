<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NipIt - Tester Feedback</title>
  <style>
    :root {
      --bg-color: #f9f9fb;
      --card-bg: #ffffff;
      --text-color: #2d3748;
      --accent-color: #4a5568;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
    }

    /* Header & Navigation Styling */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
    }

    .logo-container img {
      height: 40px;
      width: auto;
      border-radius: 8px;
    }

    .logo-text {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 1.25rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text-color);
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--accent-color);
    }

    /* Page Layout Container */
    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .content-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .page-title {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .page-description {
      text-align: center;
      color: #64748b;
      margin-bottom: 1.5rem;
    }

    /* Embedded Form Container */
    .form-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      max-width: 640px;
      height: 850px;
      border: 0;
    }

    @media (max-width: 600px) {
      header {
        padding: 0.75rem 1rem;
      }
      .content-card {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <a href="index.html" class="logo-container">
      <img src="NipIt_Logo_nobg.png" alt="NipIt Logo">
      <span class="logo-text">NipIt</span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="feedback.html">Feedback</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <div class="content-card">
      <h1 class="page-title">Tester Feedback</h1>
      <p class="page-description">
        We'd love to hear your thoughts as you explore NipIt! Whether it's positive, negative, or neutral, every bit of feedback helps us improve.
      </p>

      <div class="form-wrapper">
        <!-- Replace the src URL below with your copied Google Form embed link -->
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeCCarjynrtR7Sx-sh036itGn4cVe_Foh4d_KQDI8CTFLLNWQ/viewform?embedded=true" width="640" height="579" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
      </div>
    </div>
  </main>

</body>
</html>
